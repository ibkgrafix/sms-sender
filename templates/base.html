<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Bulk SMS{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script>document.documentElement.dataset.theme=localStorage.smsTheme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span> SMS Sender</div>
    <nav class="nav">
      <a href="/" class="{{ 'on' if page=='compose' }}">Compose</a>
      <a href="/history" class="{{ 'on' if page=='history' }}">History</a>
      <a href="/settings" class="{{ 'on' if page=='settings' }}">Settings</a>
    </nav>
    <div class="side-foot">
      <div class="bal"><span>Balance</span><b id="bal">{{ balance }}</b></div>
      <div class="row" style="justify-content:space-between">
        <span class="badge mute"><i class="dot"></i>{{ provider_label }}</span>
        <button class="btn btn-g btn-icon" id="theme" title="Toggle theme">◐</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
      <div class="row">{% block actions %}{% endblock %}</div>
    </header>
    <div class="content">{% block content %}{% endblock %}</div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
